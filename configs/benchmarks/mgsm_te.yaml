# MGSM, Telugu: the 250 GSM8K test problems translated by professional
# translators. The second Indic language MGSM covers (with Bengali).
# Scored like GSM8K: numeric equivalence on the final answer, with native
# Telugu digits normalised to ASCII before comparison.
id: mgsm_te
version: 1
family: math
task: direct

source:
  kind: hf
  ref: juletxara/mgsm
  config: te
  split: test
  checksum: "sha256:6aa45359c2cfee265619ae93d1b0ba6981445194749c4a1076a7ed5bdd223dd8"
  licence: CC-BY-4.0
  commercial_use: true
  citation: "Shi et al., 2022: Language Models are Multilingual Chain-of-Thought Reasoners"

sampling: {limit: null, seed: 1729, stratify_by: "", samples_per_item: 1}

prompt:
  template: ""
  few_shot: {n: 0, selection: fixed, pool_split: train}
  system: null
  decoding: {temperature: 0.0, max_tokens: 1024, top_p: 1.0}

scoring:
  mode: generative
  extraction:
    chain:
      - {kind: regex, pattern: '####\s*(-?[\d,\.]+)'}
      - {kind: boxed}
      - {kind: numeric}
  metric: accuracy
  chance_level: 0.0
  aggregate: [mean]

reporting:
  primary_metric: accuracy
  also: [extraction_failure_rate, refusal_rate, truncation_rate, cost_usd,
         cost_per_correct_answer, latency_p95_ms]

contamination: {canary: false, ngram_overlap_against: null, perturbations: [numeral_change]}
