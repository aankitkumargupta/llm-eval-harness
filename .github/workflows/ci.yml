name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The whole suite runs offline against a fake provider, so CI needs no API
    # key and costs nothing. That is deliberate: a test suite that requires
    # credentials is a test suite that stops being run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check harness main.py prepare_dataset.py

      - name: Test
        run: pytest -q

      - name: Validate every shipped profile
        # Config is the spine of this project: a profile that no longer loads is
        # a broken release, and it would otherwise only surface mid-run.
        run: |
          python -c "
          import glob, sys
          from harness.profiles.profile import Profile, ProfileError
          bad = []
          for f in sorted(glob.glob('configs/profiles/*.yaml')):
              try:
                  Profile.from_yaml(f)
              except ProfileError as e:
                  bad.append(f'{f}: {e}')
          print('\n'.join(bad) if bad else 'all profiles valid')
          sys.exit(1 if bad else 0)
          "
