[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.2.0"
description = "Multi-model LLM evaluation harness: rank models for a workload on accuracy, cost, latency and safety - with statistical significance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Provider SDKs beyond the OpenAI-compatible one are
# optional extras, so a user who never touches Anthropic never installs it.
dependencies = [
  "openai>=1.40.0",
  "requests>=2.31.0",
  "qdrant-client>=1.12.0",
  "pandas>=2.0.0",
  "duckdb>=1.0.0",
  "pyarrow>=14.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
ui = ["streamlit>=1.40.0", "altair>=5.5.0"]  # alt.theme.register
prep = ["pdfplumber>=0.11.0", "openpyxl>=3.1.0", "fastembed>=0.4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
  "anthropic>=0.40.0",
  "streamlit>=1.40.0", "altair>=5.5.0",
  "pdfplumber>=0.11.0", "openpyxl>=3.1.0", "fastembed>=0.4.0",
]

[project.scripts]
llm-eval = "main:main"

[tool.setuptools]
# `harness` is the library; main/app/dashboard/prepare_dataset are top-level
# entry points rather than package modules.
packages = [
  "harness", "harness.cache", "harness.clients", "harness.eval",
  "harness.orchestration", "harness.profiles", "harness.rag",
  "harness.report", "harness.store", "harness.tuning", "harness.ui",
]
py-modules = ["main", "prepare_dataset"]

[tool.pytest.ini_options]
# `pythonpath` is what makes a bare `pytest` work from a clean checkout; the
# suite previously needed PYTHONPATH=. set by hand.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:harness.*",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",    # long lines are handled by the formatter, not the linter
  "B008",    # function calls in defaults are used deliberately for dataclasses
  "SIM108",  # ternaries are not always clearer than an if/else
  "SIM105",  # try/except/pass reads clearer than contextlib.suppress here, and
             # every instance is a deliberate "must never break the run" guard
  "C408",    # dict(a=1) as a kwargs bundle is intentional and reads better
  "B905",    # zip(strict=) would change behaviour on ragged input; the call
             # sites deliberately truncate to the shorter sequence
  "UP042",   # str-Enum subclassing is load-bearing: TraceRow serialises enum
             # values straight to Parquet string columns
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use bare asserts and long descriptive names.
"tests/*" = ["B011", "E402"]
